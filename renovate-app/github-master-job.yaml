apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: sheppy-github
spec:
  image: renovate/renovate:44.181.5
  provider:
    name: github

  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-github
        key: WEBHOOK_TOKEN

  discoveryFilters:
    - FAUSheppy/tmnf-replay-server
    - FAUSheppy/fa-live-metrics
    - FAUSheppy/fa-mapgen-saas
    - FAUSheppy/notification-gateway
    - FAUSheppy/atlantis-hub
    - FAUSheppy/ntfy-acl-api
    - FAUSheppy/fa-live-metrics-client
    - FAUSheppy/atlantis-verify
    - FAUSheppy/atlantis-event-dispatcher
    - FAUSheppy/potaris-next-gen
    - FAUSheppy/icinga-webhook-gateway
    - FAUSheppy/atlantis-management
    - FAUSheppy/soundlib-interface
    - FAUSheppy/atlantis-fleet-ops

  secretRef: renovate-github

  schedule: "0 20 * * *"

  parallelism: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  access:
    adminGroups:
      - atlantis-admins

    readerGroups:
      - tools

    anonymousRead: false
    anonymousReadLogs: false

  extraEnv:
    - name: RENOVATE_ASSIGNEES
      value: '["FAUSheppy"]'

    - name: RENOVATE_CONFIG
      value: |
        {
          "extends": ["config:recommended"],
          "pip_requirements": {
            "managerFilePatterns": [
              "/(^|/)req\\.txt$/"
            ]
          },
          "minimumReleaseAge": "5 days",
          "minimumReleaseAgeBehaviour": "timestamp-required",
          "internalChecksFilter": "strict",
          "platformAutomerge": false,
          "ignoreTests": false,
          "packageRules": [
            {
              "description": "Automerge minor and patch updates",
              "matchUpdateTypes": ["minor", "patch"],
              "automerge": true,
              "automergeType": "pr"
            },
            {
              "description": "Never automerge regular major updates",
              "matchUpdateTypes": ["major"],
              "automerge": false
            }
          ],
          "vulnerabilityAlerts": {
            "enabled": true,
            "automerge": false,
            "minimumReleaseAge": "2 days",
            "prCreation": "immediate",
            "labels": ["renovate-security"],
            "vulnerabilityFixStrategy": "lowest"
          }
        }

    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "extends": [
            "config:recommended"
          ]
        }
