apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: tmnf-replay-server
spec:
  image: renovate/renovate:44.181.5
  provider:
    name: github

  discoveryFilters:
    - FAUSheppy/tmnf-replay-server
    - FAUSheppy/fa-live-metrics
    - FAUSheppy/fa-mapgen-saas
    - FAUSheppy/notification-gateway
    - FAUSheppy/atlantis-hub
    - FAUSheppy/ntfy-acl-api
    - FAUSheppy/fa-live-metrics-client
    - FAUSheppy/atlantis-verify
    - FAUSheppy/atlantis-event-dispatcher
    - FAUSheppy/potaris-next-gen

  secretRef: renovate-github

  schedule: "20 * * * *"

  parallelism: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  access:
    adminGroups:
      - atlantis-admins

    readerGroups:
      - tools

    anonymousRead: false
    anonymousReadLogs: false

  env:
    - name: RENOVATE_ASSIGNEES
      value: '["FAUSheppy"]'
