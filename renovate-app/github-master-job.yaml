apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: tmnf-replay-server
spec:
  image: renovate/renovate:42.99.0
  provider:
    name: github

  discoveryFilters:
    - FAUSheppy/tmnf-replay-server

  secretRef: renovate-github

  schedule: "0 * * * *"

  parallelism: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  access:
    adminGroups:
      - atlantis-admins

    readerGroups:
      - tools

    anonymousRead: false
    anonymousReadLogs: false
