apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy-api
  template:
    metadata:
      labels:
        app: ntfy-api
    spec:
      containers:
        - name: ntfy-api
          image: registry.services.atlantishq.de/atlantishq/ntfy-api:latest@sha256:1343fcfbaa4089925516a8b1561ecb081df87381c5148550c676cd5169bfb279
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL                                                                    
              valueFrom:
                secretKeyRef:
                  name: fa-nofication-management-db-secret
                  key: database-url
            - name: NTFY_AUTH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: fa-nofication-management-db-secret
                  key: database-url-hedgedoc-style
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fa-notification-secrets
                  key: NTFY_ACCESS_TOKEN

---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-api
spec:
  selector:
    app: ntfy-api
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
