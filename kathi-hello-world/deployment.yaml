apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-kathi
  labels:
    app: hello-world-kathi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world-kathi
  template:
    metadata:
        labels:
            app: hello-world-kathi
    spec:
      containers:
        - image: nginx:latest@sha256:689fbc6acfefc8a172d86d5779265fd52dd82e8c6b0c68c7d4aa35734340eb2a
          imagePullPolicy: Always
          name: nginx
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: html
      restartPolicy: Always
      volumes:
        - configMap:
            defaultMode: 420
            name: hello-world-html
          name: html
