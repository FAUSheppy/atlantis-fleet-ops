apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-well-known
  namespace: matrix
data:
  default.conf: |
    server {
      listen 80;

      location = /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        return 200 '{"m.server":"matrix.services.atlantishq.de:443"}';
      }

      location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        return 200 '{"m.homeserver":{"base_url":"https://matrix.services.atlantishq.de"}}';
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-well-known
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-well-known
  template:
    metadata:
      labels:
        app: matrix-well-known
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-well-known

---
apiVersion: v1
kind: Service
metadata:
  name: matrix-well-known
  namespace: matrix
spec:
  selector:
    app: matrix-well-known
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-well-known
  namespace: matrix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - atlantishq.de
      secretName: atlantishq-de-tls

  rules:
    - host: atlantishq.de
      http:
        paths:
          - path: /.well-known/matrix
            pathType: Prefix
            backend:
              service:
                name: matrix-well-known
                port:
                  number: 80
