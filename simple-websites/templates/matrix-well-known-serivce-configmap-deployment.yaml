apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-well-known
  namespace: matrix
data:
  server.json: |
    {
      "m.server": "matrix.services.atlantishq.de:443"
    }

  client.json: |
    {
      "m.homeserver": {
        "base_url": "https://matrix.services.atlantishq.de"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-well-known
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-well-known
  template:
    metadata:
      labels:
        app: matrix-well-known
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/.well-known/matrix
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-well-known
            items:
              - key: server.json
                path: server
              - key: client.json
                path: client

---
apiVersion: v1
kind: Service
metadata:
  name: matrix-well-known
  namespace: matrix
spec:
  selector:
    app: matrix-well-known
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-well-known
  namespace: matrix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - atlantishq.de
      secretName: atlantishq-de-tls

  rules:
    - host: atlantishq.de
      http:
        paths:
          - path: /.well-known/matrix
            pathType: Prefix
            backend:
              service:
                name: matrix-well-known
                port:
                  number: 80
