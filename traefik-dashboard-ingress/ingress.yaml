# IMPORTANT: This is only the ingress route, the dashboard itself is implemented in atlantis-fleet-infra/the traefik helm deployment vlaues

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.services.atlantishq.de`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      kind: Rule
      middlewares:
        - name: dashboard-redirect
        - name: oauth2-forward-auth-traefikdashboard
          namespace: sso
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    secretName: traefik-dashboard-tls
