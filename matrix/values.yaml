# Element Server Suite Community
# Chart: oci://ghcr.io/element-hq/ess-helm/matrix-stack
# Version: 26.10.0

serverName: matrix.services.atlantishq.de

# Use the existing Traefik ingress controller.
ingress:
  className: traefik
  tlsEnabled: true
  service:
    type: ClusterIP

# Do NOT deploy the chart-local PostgreSQL.
postgres:
  enabled: false

#
# Synapse
#
synapse:
  enabled: true

  ingress:
    host: matrix.services.atlantishq.de
    className: traefik
    tlsEnabled: true
    tlsSecret: matrix-services-atlantishq-de-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

  postgres:
    host: postgres.atlantishq.de
    port: 5432
    user: matrix-synapse
    database: matrix-synapse
    sslMode: require
    password:
      secret: matrix-synapse-db-secret
      secretKey: password

  # ESS Community does not natively provide S3 media storage.
  # Use a network-backed PVC here, e.g. CephFS / NFS / Longhorn RWX.
  #media:
  #  storage:
  #    existingClaim: matrix-media
  #  maxUploadSize: 100M

#
# Matrix Authentication Service
#
matrixAuthenticationService:
  enabled: true

  ingress:
    host: auth.matrix.services.atlantishq.de
    className: traefik
    tlsEnabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tlsSecret: auth-matrix-services-atlantishq-de-tls

  postgres:
    host: postgres.atlantishq.de
    port: 5432
    user: matrix-mas
    database: matrix-mas
    sslMode: require
    password:
      secret: matrix-mas-db-secret
      secretKey: password

  # Load OIDC configuration from a Secret rather than committing
  # the OIDC client secret to Git.
  additional:
    10-upstream-oidc:
      configSecret: matrix-mas-oidc
      configSecretKey: oidc.yaml
    20-account-settings:
      config: |
        account:
          email_change_allowed: true
          displayname_change_allowed: true

elementWeb:
  enabled: true

  ingress:
    host: chat.services.atlantishq.de
    className: traefik
    tlsEnabled: true
    tlsSecret: chat-services-atlantishq-de-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod


elementAdmin:
  enabled: true

  ingress:
    host: admin.matrix.services.atlantishq.de
    className: traefik
    tlsEnabled: true
    tlsSecret: admin-matrix-services-atlantishq-de-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod


matrixRTC:
  enabled: true

  ingress:
    host: rtc.matrix.services.atlantishq.de
    className: traefik
    tlsEnabled: true
    tlsSecret: rtc-matrix-services-atlantishq-de-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod


hookshot:
  enabled: true

  ingress:
    host: hookshot.matrix.services.atlantishq.de
    className: traefik
    tlsEnabled: true
    tlsSecret: hookshot-matrix-services-atlantishq-de-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
