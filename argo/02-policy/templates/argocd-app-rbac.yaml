apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-opendesk-applications
  namespace: {{ .Values.argocdNamespace }}
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-opendesk-applications
  namespace: {{ .Values.argocdNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controllerServiceAccount }}
    namespace: {{ .Values.argocdNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-opendesk-applications
