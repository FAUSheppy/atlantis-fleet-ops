{{- range $namespace := .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-application-controller
  namespace: {{ $namespace }}
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
{{- range $.Values.verbs }}
      - {{ . }}
{{- end }}
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-controller
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.controllerServiceAccount }}
    namespace: {{ $.Values.argocdNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-application-controller
{{- end }}
