apiVersion: apps/v1
kind: Deployment
metadata:
  name: docspell
  namespace: docspell
spec:
  selector:
    matchLabels:
      app: docspell
  template:
    metadata:
      labels:
        app: docspell
    spec:
      initContainers:
        - name: render-config
          image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache gettext
              envsubst < /config/application.conf.tpl > /work/application.conf
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: docspell-db-secret
                  key: user
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: docspell-db-secret
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: docspell-db-secret
                  key: db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docspell-db-secret
                  key: password

            - name: OIDC_ISSUER_URL
              value: https://keycloak.atlantishq.de/realms/master
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: docspell-oidc-config
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: docspell-oidc-config
                  key: client-secret

            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: docspell-secrets
                  key: S3_SECRET_KEY
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: docspell-secrets
                  key: S3_ACCESS_KEY
          volumeMounts:
            - name: config
              mountPath: /config
            - name: rendered-config
              mountPath: /work
      containers:

        - name: restserver
          image: ghcr.io/docspell/restserver:latest@sha256:bc8f0c0e072726aca121f07b9f4519ea8360ee3e0a6464f4cd960d3260093826
          args:
            - /opt/docspell.conf
          ports:
            - containerPort: 7880
          volumeMounts:
            - name: rendered-config
              mountPath: /opt/docspell.conf
              subPath: application.conf
        - name: joex
          image: ghcr.io/docspell/joex:latest@sha256:19c8daf22de5ff7625c16abb319c6bcb1354ada0782bd546d91b2be72acbb34f
          envFrom:
            - secretRef:
                name: docspell-secrets
          volumeMounts:
            - name: rendered-config
              mountPath: /opt/docspell.conf
              subPath: application.conf


        #- name: consumedir
        #  image: ghcr.io/docspell/consumedir:latest
        #  envFrom:
        #    - secretRef:
        #        name: docspell-secrets
        #  volumeMounts:
        #    - name: config
        #      mountPath: /opt/docspell/conf/application.conf
        #      subPath: application.conf

      volumes:
        - name: config
          configMap:
            name: docspell-config
        - name: rendered-config
          emptyDir: {}
