replicaCount: 1

image:
  registry: registry.services.atlantishq.de
  repository: atlantishq/nextcloud
  flavor: apache
  tag: "latest"
  pullPolicy: Always

nextcloud:
  host: nextcloud.services.atlantishq.de

  trustedDomains:
    - nextcloud.services.atlantishq.de

  existingSecret:
    enabled: true
    secretName: nextcloud
    usernameKey: ADMIN_USER
    passwordKey: ADMIN_PASSWORD

  #
  # Environment used by our persistent/reproducible config.php
  #
  extraEnv:
    - name: NC_INSTANCE_ID
      valueFrom:
        secretKeyRef:
          name: nextcloud
          key: INSTANCE_ID

    - name: NC_PASSWORD_SALT
      valueFrom:
        secretKeyRef:
          name: nextcloud
          key: PASSWORD_SALT

    - name: NC_INSTANCE_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud
          key: INSTANCE_SECRET

    - name: OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: nextcloud-oidc-config
          key: client-id

    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud-oidc-config
          key: client-secret

    - name: OIDC_DISCOVERY_URI
      value: https://keycloak.atlantishq.de/realms/master/.well-known/openid-configuration

  #
  # Recreate the mandatory config.php before the Nextcloud
  # Docker entrypoint runs.
  #
  extraInitContainers:
    - name: create-nextcloud-config
      image: busybox:1.37
      imagePullPolicy: IfNotPresent

      command:
        - /bin/sh
        - -ec
        - |
          mkdir -p /var/www/html/config

          cat > /var/www/html/config/config.php <<'PHP'
          <?php
          $CONFIG = array (
            'installed' => true,

            'instanceid' => getenv('NC_INSTANCE_ID'),
            'passwordsalt' => getenv('NC_PASSWORD_SALT'),
            'secret' => getenv('NC_INSTANCE_SECRET'),

            'dbtype' => 'pgsql',
            'dbname' => getenv('POSTGRES_DB'),
            'dbhost' => getenv('POSTGRES_HOST'),
            'dbuser' => getenv('POSTGRES_USER'),
            'dbpassword' => getenv('POSTGRES_PASSWORD'),

            'datadirectory' => '/var/www/html/data',

            'trusted_domains' => array (
              0 => 'localhost',
              1 => 'nextcloud.services.atlantishq.de',
            ),

            'overwriteprotocol' => 'https',
          );
          PHP

          chown 33:33 /var/www/html/config/config.php
          chmod 640 /var/www/html/config/config.php

      volumeMounts:
        - name: nextcloud-main
          mountPath: /var/www/html

  #
  # Normal additional Nextcloud config fragments.
  #
  configs:
    postgres-ssl.config.php: |-
      <?php
      $CONFIG = array (
        'pgsql_ssl' => array (
          'mode' => 'verify-full',
          'rootcert' => 'system',
        ),
      );

  #
  # S3 as primary storage
  #
  objectStore:
    s3:
      enabled: true

      existingSecret: nextcloud

      secretKeys:
        host: S3_ENDPOINT
        accessKey: S3_ACCESS_KEY
        secretKey: S3_SECRET_KEY
        bucket: S3_BUCKET

      ssl: true
      port: "443"
      region: euw
      usePathStyle: true
      autoCreate: false

  #
  # This must run on every pod start, not only after initial installation.
  #
  # user_oidc must already be present in your custom Docker image.
  #
  hooks:
    before-starting: |-
      #!/bin/sh
      set -eu

      php /var/www/html/occ app:enable user_oidc

      php /var/www/html/occ user_oidc:provider oidc \
        --clientid="${`${OIDC_CLIENT_ID}`}" \
        --clientsecret="${`${OIDC_CLIENT_SECRET}`}" \
        --discoveryuri="${`${OIDC_DISCOVERY_URI}`}" \
        --group-provisioning=1 \
        --group-whitelist-regex='/^atlantis-admins$/'

      php /var/www/html/occ config:app:set \
        --type=string \
        --value=0 \
        user_oidc allow_multiple_user_backends

      php /var/www/html/occ config:app:set \
        files default_quota \
        --value='2 GB'

#
# PostgreSQL
#
internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql

  existingSecret:
    enabled: true
    secretName: nextcloud-db-secret
    hostKey: db-host
    usernameKey: user
    passwordKey: password
    databaseKey: db

postgresql:
  enabled: false

mariadb:
  enabled: false

#
# No PVCs
#
persistence:
  enabled: false

  nextcloudData:
    enabled: false

#
# Redis
#
redis:
  enabled: false

externalRedis:
  enabled: false

#
# Background jobs
#
cronjob:
  enabled: true
  type: cronjob

  cronjob:
    schedule: "*/5 * * * *"

#
# Service
#
service:
  type: ClusterIP
  port: 8080

#
# Ingress
#
ingress:
  enabled: true
  className: traefik

  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod

  path: /
  pathType: Prefix

  tls:
    - secretName: nextcloud-tls
      hosts:
        - nextcloud.services.atlantishq.de

#
# Reverse proxy
#
phpClientHttpsFix:
  enabled: true
  protocol: https

#
# Probes
#
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
