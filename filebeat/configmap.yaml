apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat
  namespace: filebeat
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: kubernetes
        paths:
          - /var/log/containers/*.log
        prospector.scanner.symlinks: true

        parsers:
          - container: ~
          - multiline:
              type: pattern
              pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
              negate: true
              match: after

        fields:
          log_type: kubernetes

        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              scope: node
              use_kubeadm: false
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

    output.logstash:
      hosts:
        - "beats.atlantishq.de:443"
      ssl.enabled: true
