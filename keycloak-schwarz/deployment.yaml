apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-schwarz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-schwarz
  template:
    metadata:
      labels:
        app: keycloak-schwarz
    spec:
      initContainers:
      - name: render-realm
        image: alpine
        command:
          - sh
          - -c
          - |
            apk add gettext
            envsubst < /templates/realm.json > /generated/realm.json
        volumeMounts:
          - name: realm-import
            mountPath: /templates
            readOnly: true
          - name: generated-config
            mountPath: /generated

        env:
          - name: ATLANTIS_FEDERATION_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: keycloak-schwarz-oidc-config
                key: client-secret
          - name: SCHWARZ_DEBUG_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: keycloak-schwarz-secrets
                key: SCHWARZ_DEBUG_CLIENT_SECRET

      containers:
      - name: keycloak
        image: registry.services.atlantishq.de/atlantishq/keycloak-schwarz-email-username-mapper:26.6.4

        args:
          - start
          - --import-realm

        env:
          - name: KC_HTTP_ENABLED
            value: "true"

          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin

          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-schwarz-secrets
                key: KC_ADMIN_PASSWORD

          - name: KC_HOSTNAME
            value: keycloak-schwarz.services.atlantishq.de

          - name: KC_PROXY_HEADERS
            value: xforwarded

        volumeMounts:
          - name: generated-config
            mountPath: /opt/keycloak/data/import

      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
        - name: generated-config
          emptyDir: {}
